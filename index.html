<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>电子木鱼 · 敲一敲，功德 +1</title>
<meta name="description" content="一只安静的电子木鱼。轻敲木鱼，功德 +1，记录今日与累计功德。">
<meta name="theme-color" content="#F4EDE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="木鱼">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
  :root{
    --bg:#F4EDE3;
    --bg-deep:#EDE1D2;
    --card:rgba(255,253,248,.78);
    --card-solid:#FFFDF8;
    --text:#2A2119;
    --muted:#8C7B69;
    --line:rgba(80,56,32,.12);
    --accent:#B86B2E;
    --gold:#D8A45C;
    --seal:#B54234;
    --cushion:#3E5A50;
    --serif:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
    --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --shadow:0 18px 45px rgba(73,45,20,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171310;
      --bg-deep:#100D0B;
      --card:rgba(40,33,27,.76);
      --card-solid:#28211B;
      --text:#F3E9DC;
      --muted:#A69582;
      --line:rgba(243,233,220,.12);
      --accent:#D9A05B;
      --gold:#E0B36D;
      --seal:#A93C30;
      --cushion:#2E4038;
      --shadow:0 18px 45px rgba(0,0,0,.32);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100vh;
    min-height:100dvh;
    color:var(--text);
    font-family:var(--sans);
    background:
      radial-gradient(900px 620px at 50% -12%, rgba(255,255,255,.55), transparent 62%),
      radial-gradient(820px 620px at 108% 104%, rgba(196,142,86,.14), transparent 64%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.45;
    background-image:radial-gradient(rgba(90,60,30,.10) .55px, transparent .7px);
    background-size:5px 5px;
    mix-blend-mode:multiply;
  }
  @media (prefers-color-scheme: dark){
    body::before{opacity:.22;mix-blend-mode:screen;background-image:radial-gradient(rgba(255,236,208,.12) .55px, transparent .7px)}
  }
  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    margin:0 auto;
    padding:max(18px, env(safe-area-inset-top)) 22px max(14px, env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .seal{
    width:40px;
    height:44px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 0;
    border-radius:8px;
    background:linear-gradient(145deg,#C6503F,#9A3026);
    color:#FFF7E9;
    font-family:var(--serif);
    font-size:13px;
    letter-spacing:.18em;
    line-height:1.1;
    writing-mode:vertical-rl;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.24), 0 7px 16px rgba(150,50,35,.22);
  }
  .eyebrow{
    margin:0 0 3px;
    font-size:9px;
    font-weight:650;
    letter-spacing:.27em;
    color:var(--muted);
  }
  h1{
    margin:0;
    font-family:var(--serif);
    font-size:27px;
    font-weight:600;
    line-height:1;
    letter-spacing:.08em;
  }
  .icon-btn{
    width:42px;
    height:42px;
    flex:0 0 auto;
    display:grid;
    place-items:center;
    border:1px solid var(--line);
    border-radius:50%;
    background:var(--card);
    color:var(--muted);
    cursor:pointer;
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    transition:transform .15s ease, color .15s ease, background .15s ease;
  }
  .icon-btn:active{transform:scale(.92)}
  .icon-btn:focus-visible,.reset:focus-visible,.muyu:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .icon-btn svg{width:19px;height:19px;display:block}
  .icon-btn .sound-off{display:none}
  .icon-btn.muted{color:var(--accent)}
  .icon-btn.muted .sound-on{display:none}
  .icon-btn.muted .sound-off{display:block}
  .tagline{
    margin:16px 0 0;
    text-align:center;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--muted);
  }
  main{display:flex;flex-direction:column;flex:1}
  .stage{
    position:relative;
    width:min(100%, 360px, 42vh);
    width:min(100%, 360px, 42dvh);
    aspect-ratio:1;
    margin:4px auto 10px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .halo{
    position:absolute;
    inset:7%;
    border-radius:50%;
    background:radial-gradient(circle at 50% 44%, rgba(216,164,92,.24), rgba(216,164,92,.06) 46%, transparent 68%);
    filter:blur(3px);
    pointer-events:none;
  }
  .halo::after{
    content:"";
    position:absolute;
    inset:11%;
    border:1px solid rgba(184,107,46,.13);
    border-radius:50%;
  }
  .muyu{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    padding:0;
    border:0;
    background:none;
    display:block;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    filter:drop-shadow(0 22px 25px rgba(65,38,16,.16));
  }
  .muyu-svg{display:block;width:100%;height:100%;overflow:visible}
  .muyu:focus-visible{border-radius:50%}
  .ripple{
    position:absolute;
    left:50%;
    top:58%;
    z-index:1;
    width:56%;
    aspect-ratio:1;
    border:1.5px solid rgba(184,107,46,.42);
    border-radius:50%;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(.72);
  }
  .ripple.r2{border-color:rgba(216,164,92,.34)}
  .ripple.go{animation:ripple .66s ease-out}
  @keyframes ripple{
    0%{opacity:.7;transform:translate(-50%,-50%) scale(.72)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.38)}
  }
  .fx{position:absolute;inset:0;z-index:3;overflow:visible;pointer-events:none}
  .float{
    position:absolute;
    left:50%;
    bottom:10%;
    font-family:var(--serif);
    font-size:19px;
    font-weight:700;
    letter-spacing:.02em;
    color:#FFF9EC;
    white-space:nowrap;
    opacity:0;
    -webkit-text-stroke:.55px rgba(90,45,15,.45);
    text-shadow:0 2px 3px rgba(60,30,8,.55), 0 8px 20px rgba(60,30,8,.28);
  }
  .float.go{animation:floatUp .95s cubic-bezier(.18,.72,.32,1) forwards}
  @media (prefers-color-scheme: dark){.float{color:#FFE7BE;-webkit-text-stroke:.55px rgba(0,0,0,.5);text-shadow:0 2px 4px rgba(0,0,0,.75), 0 8px 20px rgba(0,0,0,.45)}}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,8px) scale(.82) rotate(var(--rot,0deg))}
    14%{opacity:1}
    68%{opacity:.96}
    100%{opacity:0;transform:translate(-50%,-50px) scale(1.04) rotate(var(--rot,0deg))}
  }
  .spark{
    position:absolute;
    left:50%;
    top:47%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px rgba(216,164,92,.9);
    animation:spark .9s ease-out forwards;
  }
  @keyframes spark{
    0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2)}
  }
  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    width:100%;
    margin-top:2px;
  }
  .stat{
    min-width:0;
    padding:14px 14px 13px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--card);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    box-shadow:0 2px 12px rgba(70,45,20,.04);
    text-align:center;
  }
  .stat-label{
    display:block;
    margin-bottom:5px;
    font-size:11px;
    letter-spacing:.12em;
    color:var(--muted);
  }
  .stat-value{
    display:inline-block;
    font-family:var(--serif);
    font-size:clamp(26px, 7vw, 34px);
    font-weight:650;
    line-height:1.05;
    letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
    transform-origin:center;
  }
  .stat-value.pop{animation:pop .28s cubic-bezier(.2,.8,.3,1.4)}
  @keyframes pop{0%,100%{transform:scale(1)}45%{transform:scale(1.12)}}
  .goal{
    width:100%;
    margin-top:12px;
    padding:14px 16px 15px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--card);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    box-shadow:0 2px 12px rgba(70,45,20,.04);
  }
  .goal-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:9px;
    font-size:12px;
    letter-spacing:.06em;
    color:var(--muted);
  }
  .goal-head b{
    color:var(--text);
    font-weight:650;
    font-variant-numeric:tabular-nums;
  }
  .bar{
    height:7px;
    border-radius:99px;
    background:rgba(120,80,45,.13);
    overflow:hidden;
  }
  .bar i{
    display:block;
    width:0;
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,#C98A4B,#B8682D);
    transition:width .35s cubic-bezier(.2,.8,.3,1);
  }
  @media (prefers-color-scheme: dark){.bar{background:rgba(243,233,220,.1)}}
  .done{
    margin:9px 0 0;
    text-align:center;
    font-size:11px;
    font-weight:650;
    letter-spacing:.12em;
    color:var(--accent);
  }
  [hidden]{display:none !important}
  .actions{display:flex;justify-content:center;margin-top:14px}
  .reset{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:9px 14px;
    border:1px solid transparent;
    border-radius:99px;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:12px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .reset svg{width:14px;height:14px;opacity:.8}
  .reset:active{transform:scale(.96)}
  .reset.armed{background:#B54234;border-color:#B54234;color:#FFF7E9}
  .footer{
    margin-top:auto;
    padding-top:14px;
    text-align:center;
    font-size:10px;
    letter-spacing:.08em;
    color:var(--muted);
    opacity:.75;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(24px + env(safe-area-inset-bottom));
    z-index:50;
    max-width:82vw;
    padding:11px 18px;
    border-radius:99px;
    background:rgba(38,28,20,.92);
    color:#FFF8ED;
    font-size:12px;
    letter-spacing:.05em;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,16px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-height:720px){
    .app{padding-top:max(12px, env(safe-area-inset-top))}
    .tagline{margin-top:10px}
    .stage{width:min(100%, 320px, 38dvh);margin-bottom:4px}
    .stat{padding:10px 12px}
    .stat-value{font-size:clamp(24px, 6.6vw, 30px)}
    .goal{margin-top:10px;padding:11px 14px 12px}
    .actions{margin-top:8px}
    .footer{padding-top:8px}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="seal" aria-hidden="true">功德</span>
      <div>
        <p class="eyebrow">DIGITAL MUYU</p>
        <h1>木鱼</h1>
      </div>
    </div>
    <button class="icon-btn" id="soundBtn" type="button" aria-label="关闭音效" aria-pressed="true">
      <svg class="sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/>
        <path d="M15 9.5a3.5 3.5 0 0 1 0 5"/>
        <path d="M18 7a7 7 0 0 1 0 10"/>
      </svg>
      <svg class="sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/>
        <path d="m16 9 5 6M21 9l-5 6"/>
      </svg>
    </button>
  </header>

  <main>
    <p class="tagline">敲一敲，功德 +1</p>

    <div class="stage" id="stage">
      <div class="halo" aria-hidden="true"></div>
      <div class="ripple r1" id="ripple1" aria-hidden="true"></div>
      <div class="ripple r2" id="ripple2" aria-hidden="true"></div>

      <button class="muyu" id="muyu" type="button" aria-label="敲木鱼，功德加一">
        <svg class="muyu-svg" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <path id="fishShape" d="M180 94c50 0 94 20 110 56 16 36 12 74-10 98-22 24-58 36-100 36s-78-12-100-36c-22-24-26-62-10-98 16-36 60-56 110-56Z"/>
            <clipPath id="fishClip"><use href="#fishShape"/></clipPath>
            <linearGradient id="woodBody" x1=".12" y1="0" x2=".88" y2="1">
              <stop offset="0" stop-color="#E9B980"/>
              <stop offset=".26" stop-color="#CE9158"/>
              <stop offset=".58" stop-color="#A26537"/>
              <stop offset=".82" stop-color="#7C4A25"/>
              <stop offset="1" stop-color="#5B3419"/>
            </linearGradient>
            <linearGradient id="woodRim" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#F3C891"/>
              <stop offset=".46" stop-color="#BD7D45"/>
              <stop offset="1" stop-color="#75431F"/>
            </linearGradient>
            <radialGradient id="woodGloss" cx=".34" cy=".18" r=".82">
              <stop offset="0" stop-color="#FFF" stop-opacity=".38"/>
              <stop offset=".42" stop-color="#FFF" stop-opacity=".08"/>
              <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="malletWood" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#E8BA82"/>
              <stop offset=".46" stop-color="#BC7E48"/>
              <stop offset="1" stop-color="#734120"/>
            </linearGradient>
            <linearGradient id="cushionGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#557468"/>
              <stop offset="1" stop-color="#2C4139"/>
            </linearGradient>
            <filter id="softShadow" x="-40%" y="-40%" width="180%" height="190%">
              <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#3B2410" flood-opacity=".24"/>
            </filter>
          </defs>

          <g class="cushion">
            <ellipse cx="180" cy="299" rx="111" ry="24" fill="url(#cushionGrad)"/>
            <ellipse cx="180" cy="292" rx="101" ry="18" fill="#4B695D"/>
            <ellipse cx="180" cy="291" rx="91" ry="13" fill="none" stroke="#C9A15E" stroke-opacity=".34" stroke-width="1.4"/>
            <path d="M74 300q-13 10-8 25" fill="none" stroke="#B8874A" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
            <circle cx="66" cy="326" r="3.2" fill="#C9A15E" opacity=".8"/>
            <path d="M286 300q13 10 8 25" fill="none" stroke="#B8874A" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
            <circle cx="294" cy="326" r="3.2" fill="#C9A15E" opacity=".8"/>
          </g>

          <g class="fish" style="transform-box:view-box;transform-origin:180px 252px">
            <use href="#fishShape" fill="url(#woodBody)" filter="url(#softShadow)"/>
            <use href="#fishShape" fill="url(#woodGloss)"/>
            <g clip-path="url(#fishClip)" opacity=".55">
              <path d="M96 96C86 154 92 226 116 282" fill="none" stroke="#3B2412" stroke-width="1.5" opacity=".28"/>
              <path d="M122 94C112 154 118 226 142 286" fill="none" stroke="#3B2412" stroke-width="1" opacity=".22"/>
              <path d="M150 94C144 154 146 222 162 288" fill="none" stroke="#F8D6A8" stroke-width="1.2" opacity=".2"/>
              <path d="M208 94C214 154 212 222 196 288" fill="none" stroke="#3B2412" stroke-width="1.2" opacity=".24"/>
              <path d="M236 94C246 154 240 226 216 286" fill="none" stroke="#3B2412" stroke-width="1.5" opacity=".26"/>
              <path d="M262 98C272 154 266 226 242 282" fill="none" stroke="#3B2412" stroke-width="1" opacity=".2"/>
            </g>
            <use href="#fishShape" fill="none" stroke="#3B2412" stroke-opacity=".36" stroke-width="2"/>

            <g class="fish-mouth">
              <ellipse cx="180" cy="104" rx="46" ry="12.5" fill="#2A1608"/>
              <ellipse cx="180" cy="102" rx="38" ry="8.6" fill="#170B04"/>
              <ellipse cx="180" cy="103" rx="46" ry="12.5" fill="none" stroke="#E9B980" stroke-width="2.2" opacity=".72"/>
              <path d="M144 102q36 10 72 0" fill="none" stroke="#F8D6A8" stroke-width="1" opacity=".24"/>
              <path d="M180 113c-3 38-3 72 0 101" fill="none" stroke="#2A1608" stroke-width="7" stroke-linecap="round" opacity=".78"/>
              <path d="M183.5 114c-2.5 37-2.5 70 .5 98" fill="none" stroke="#F3C891" stroke-width="1.2" stroke-linecap="round" opacity=".22"/>
            </g>

            <g class="fish-eyes">
              <g transform="translate(126 171)">
                <circle r="19" fill="#3B2412" opacity=".16"/>
                <circle r="16" fill="#2A170A"/>
                <circle r="12" fill="#8A5328"/>
                <circle r="7.5" fill="#180C04"/>
                <circle cx="-3" cy="-4" r="2.8" fill="#F8D6A8" opacity=".8"/>
                <circle r="17" fill="none" stroke="#E9B980" stroke-width="1.6" opacity=".52"/>
              </g>
              <g transform="translate(234 171)">
                <circle r="19" fill="#3B2412" opacity=".16"/>
                <circle r="16" fill="#2A170A"/>
                <circle r="12" fill="#8A5328"/>
                <circle r="7.5" fill="#180C04"/>
                <circle cx="-3" cy="-4" r="2.8" fill="#F8D6A8" opacity=".8"/>
                <circle r="17" fill="none" stroke="#E9B980" stroke-width="1.6" opacity=".52"/>
              </g>
            </g>

            <path d="M151 231q29 14 58 0" fill="none" stroke="#2A170A" stroke-width="4.5" stroke-linecap="round" opacity=".66"/>
            <path d="M151 228q29 14 58 0" fill="none" stroke="#F8D6A8" stroke-width="1.1" stroke-linecap="round" opacity=".22"/>

            <g fill="none" stroke="#3B2412" stroke-linecap="round" opacity=".2">
              <path d="M92 196q18-13 36 0" stroke-width="1.5"/>
              <path d="M86 220q19-13 38 0" stroke-width="1.3"/>
              <path d="M94 244q16-11 32 0" stroke-width="1.2"/>
              <path d="M232 196q18-13 36 0" stroke-width="1.5"/>
              <path d="M236 220q19-13 38 0" stroke-width="1.3"/>
              <path d="M234 244q16-11 32 0" stroke-width="1.2"/>
            </g>

            <ellipse cx="180" cy="281" rx="72" ry="9" fill="#2A1608" opacity=".12"/>
          </g>

          <g class="mallet" style="transform-box:view-box;transform-origin:320px 14px">
            <path d="M320 14 232 92" stroke="#3B2412" stroke-width="16" stroke-linecap="round" opacity=".18" transform="translate(0 4)"/>
            <path d="M320 14 232 92" stroke="url(#malletWood)" stroke-width="13" stroke-linecap="round"/>
            <path d="M317 17 233 90" stroke="#F8D6A8" stroke-width="2" stroke-linecap="round" opacity=".22"/>
            <g transform="translate(228 96)">
              <circle r="23" fill="#3B2412" opacity=".2" transform="translate(2 4)"/>
              <circle r="22" fill="url(#malletWood)"/>
              <circle r="22" fill="none" stroke="#3B2412" stroke-width="1.5" opacity=".42"/>
              <circle r="12" fill="none" stroke="#3B2412" stroke-width="1" opacity=".24"/>
              <ellipse cx="-7" cy="-8" rx="7" ry="4.6" fill="#FFF" opacity=".22" transform="rotate(-30)"/>
            </g>
            <circle cx="320" cy="14" r="7" fill="#7A4A25"/>
            <circle cx="320" cy="14" r="7" fill="none" stroke="#3B2412" stroke-width="1" opacity=".4"/>
          </g>
        </svg>
      </button>

      <div class="fx" id="fx" aria-hidden="true"></div>
    </div>

    <section class="stats" aria-label="功德统计">
      <div class="stat">
        <span class="stat-label">今日功德</span>
        <strong class="stat-value" id="today">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">累计功德</span>
        <strong class="stat-value" id="total">0</strong>
      </div>
    </section>

    <section class="goal" aria-label="今日目标">
      <div class="goal-head">
        <span>今日目标</span>
        <span><b id="goalToday">0</b> / 1000</span>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-label="今日目标进度" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0">
        <i id="barFill"></i>
      </div>
      <p class="done" id="done" hidden>今日目标已完成</p>
    </section>

    <div class="actions">
      <button class="reset" id="reset" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>今日清零</span>
      </button>
    </div>
  </main>

  <footer class="footer">数据仅保存在本机 · 可添加到主屏幕</footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var GOAL = 1000;
  var KEY = 'muyu_v3';

  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');
  var muyu = $('muyu');
  var fx = $('fx');
  var todayEl = $('today');
  var totalEl = $('total');
  var goalTodayEl = $('goalToday');
  var bar = $('bar');
  var barFill = $('barFill');
  var doneEl = $('done');
  var resetBtn = $('reset');
  var resetLabel = resetBtn.querySelector('span');
  var soundBtn = $('soundBtn');
  var toastEl = $('toast');
  var mallet = document.querySelector('.mallet');
  var fish = document.querySelector('.fish');
  var ripple1 = $('ripple1');
  var ripple2 = $('ripple2');

  function dateKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function readState() {
    var fallback = { today: 0, total: 0, lastDate: dateKey(), muted: false, celebrated: false };
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return fallback;
      var data = JSON.parse(raw) || {};
      return {
        today: Math.max(0, parseInt(data.today, 10) || 0),
        total: Math.max(0, parseInt(data.total, 10) || 0),
        lastDate: typeof data.lastDate === 'string' ? data.lastDate : fallback.lastDate,
        muted: !!data.muted,
        celebrated: !!data.celebrated
      };
    } catch (e) {
      return fallback;
    }
  }

  var state = readState();

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function fmt(n) {
    try { return Number(n).toLocaleString('zh-CN'); }
    catch (e) { return String(n); }
  }

  function bump(el) {
    if (!el) return;
    el.classList.remove('pop');
    void el.getBoundingClientRect();
    el.classList.add('pop');
    clearTimeout(el._popTimer);
    el._popTimer = setTimeout(function () { el.classList.remove('pop'); }, 320);
  }

  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function update(animate) {
    todayEl.textContent = fmt(state.today);
    totalEl.textContent = fmt(state.total);
    goalTodayEl.textContent = fmt(state.today);
    barFill.style.width = Math.min(100, (state.today / GOAL) * 100) + '%';
    bar.setAttribute('aria-valuenow', String(Math.min(state.today, GOAL)));
    doneEl.hidden = state.today < GOAL;

    if (animate) {
      bump(todayEl);
      bump(totalEl);
    }

    if (state.today >= GOAL && !state.celebrated) {
      state.celebrated = true;
      save();
      setTimeout(function () {
        toast('今日目标已完成');
        celebrate();
      }, 240);
    }
  }

  function rollDay() {
    var key = dateKey();
    if (state.lastDate === key) return;
    state.today = 0;
    state.lastDate = key;
    state.celebrated = false;
    save();
    update(false);
  }

  function playOnce(el, cls, ms) {
    if (!el) return;
    el.classList.remove(cls);
    void el.getBoundingClientRect();
    el.classList.add(cls);
    clearTimeout(el._animTimer);
    el._animTimer = setTimeout(function () { el.classList.remove(cls); }, ms);
  }

  var floatEl = null;

  function spawnFloat() {
    if (!floatEl) {
      floatEl = document.createElement('span');
      floatEl.className = 'float';
      fx.appendChild(floatEl);
    }
    floatEl.textContent = Math.random() < 0.56 ? '功德 +1' : '+1';
    floatEl.style.left = (34 + Math.random() * 12) + '%';
    floatEl.style.bottom = (7 + Math.random() * 6) + '%';
    floatEl.style.setProperty('--rot', (Math.random() * 10 - 5).toFixed(1) + 'deg');
    floatEl.classList.remove('go');
    void floatEl.getBoundingClientRect();
    floatEl.classList.add('go');
  }

  function celebrate() {
    for (var i = 0; i < 18; i++) {
      (function (i) {
        var spark = document.createElement('i');
        spark.className = 'spark';
        var angle = Math.random() * Math.PI * 2;
        var distance = 54 + Math.random() * 86;
        spark.style.setProperty('--dx', (Math.cos(angle) * distance).toFixed(1) + 'px');
        spark.style.setProperty('--dy', (Math.sin(angle) * distance).toFixed(1) + 'px');
        spark.style.animationDelay = (Math.random() * 0.12).toFixed(2) + 's';
        fx.appendChild(spark);
        setTimeout(function () {
          if (spark.parentNode) spark.parentNode.removeChild(spark);
        }, 1150);
      })(i);
    }
  }

  var actx = null;
  var noiseBuffer = null;

  function ensureAudio() {
    if (state.muted) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!actx) {
      try {
        actx = new AC();
        var buffer = actx.createBuffer(1, 1, 22050);
        var source = actx.createBufferSource();
        source.buffer = buffer;
        source.connect(actx.destination);
        source.start(0);
      } catch (e) {
        actx = null;
        return null;
      }
    } else if (actx.state === 'suspended') {
      try { actx.resume(); } catch (e) {}
    }
    return actx;
  }

  function playTok() {
    if (state.muted) return;
    var ac = ensureAudio();
    if (!ac) return;
    var t = ac.currentTime + 0.001;
    var master = ac.createGain();
    master.gain.value = 0.38;
    master.connect(ac.destination);

    if (!noiseBuffer) {
      var length = Math.max(1, Math.floor(ac.sampleRate * 0.07));
      noiseBuffer = ac.createBuffer(1, length, ac.sampleRate);
      var data = noiseBuffer.getChannelData(0);
      for (var i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.6);
      }
    }

    var noise = ac.createBufferSource();
    noise.buffer = noiseBuffer;
    var band = ac.createBiquadFilter();
    band.type = 'bandpass';
    band.frequency.value = 1450;
    band.Q.value = 0.85;
    var noiseGain = ac.createGain();
    noiseGain.gain.setValueAtTime(0.34, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    noise.connect(band);
    band.connect(noiseGain);
    noiseGain.connect(master);
    noise.start(t);
    noise.stop(t + 0.08);

    var body = ac.createOscillator();
    body.type = 'sine';
    body.frequency.setValueAtTime(182, t);
    body.frequency.exponentialRampToValueAtTime(92, t + 0.12);
    var bodyGain = ac.createGain();
    bodyGain.gain.setValueAtTime(0.0001, t);
    bodyGain.gain.exponentialRampToValueAtTime(0.52, t + 0.005);
    bodyGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
    body.connect(bodyGain);
    bodyGain.connect(master);
    body.start(t);
    body.stop(t + 0.2);

    var wood = ac.createOscillator();
    wood.type = 'triangle';
    wood.frequency.setValueAtTime(720, t);
    wood.frequency.exponentialRampToValueAtTime(320, t + 0.06);
    var woodGain = ac.createGain();
    woodGain.gain.setValueAtTime(0.12, t);
    woodGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    wood.connect(woodGain);
    woodGain.connect(master);
    wood.start(t);
    wood.stop(t + 0.1);

    setTimeout(function () {
      try { master.disconnect(); } catch (e) {}
    }, 480);
  }

  function buzz() {
    if (!navigator.vibrate) return;
    try { navigator.vibrate(8); } catch (e) {}
  }

  var lastStrike = 0;
  var pointerGuard = 0;

  function strike(event) {
    if (event && event.type === 'pointerdown') {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      event.preventDefault();
      pointerGuard = performance.now() + 700;
    }
    var now = performance.now();
    if (now - lastStrike < 45) return;
    lastStrike = now;

    rollDay();
    state.today += 1;
    state.total += 1;
    save();
    update(true);

    playOnce(mallet, 'strike', 220);
    playOnce(fish, 'strike', 240);
    playOnce(ripple1, 'go', 700);
    playOnce(ripple2, 'go', 700);
    spawnFloat();
    playTok();
    buzz();
  }

  function updateSound() {
    soundBtn.setAttribute('aria-pressed', String(!state.muted));
    soundBtn.setAttribute('aria-label', state.muted ? '开启音效' : '关闭音效');
    soundBtn.classList.toggle('muted', state.muted);
  }

  var resetArmed = false;
  var resetTimer = null;

  function disarmReset() {
    resetArmed = false;
    resetBtn.classList.remove('armed');
    resetLabel.textContent = '今日清零';
    clearTimeout(resetTimer);
  }

  function armReset() {
    resetArmed = true;
    resetBtn.classList.add('armed');
    resetLabel.textContent = '再点一次确认';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(disarmReset, 3000);
  }

  muyu.addEventListener('pointerdown', strike, { passive: false });
  muyu.addEventListener('click', function (event) {
    if (event.detail > 0 && performance.now() < pointerGuard) return;
    strike(event);
  });

  soundBtn.addEventListener('click', function () {
    state.muted = !state.muted;
    save();
    updateSound();
    if (!state.muted) {
      ensureAudio();
      playTok();
      toast('音效已开启');
    } else {
      toast('音效已关闭');
    }
  });

  resetBtn.addEventListener('click', function () {
    if (state.today === 0) {
      toast('今天还没有敲过');
      return;
    }
    if (!resetArmed) {
      armReset();
      return;
    }
    state.today = 0;
    state.celebrated = false;
    save();
    update(false);
    disarmReset();
    toast('今日功德已清零');
  });

  document.addEventListener('pointerdown', function (event) {
    if (resetArmed && !resetBtn.contains(event.target)) disarmReset();
  }, true);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) rollDay();
  });

  setInterval(rollDay, 30000);

  rollDay();
  update(false);
  updateSound();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
